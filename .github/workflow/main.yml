name: CI devops 2025

on:
  # Launch this job when pushing to main or develop
  push:
    branches:
      - main
      - develop

  # Also launch the job for pull requests
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      # Checkout your GitHub code
      - uses: actions/checkout@v4

      # Setup JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Build and test the application with Maven
      - name: Build and test with Maven
        run: mvn clean verify