name: CI TP2-Docker

on:
    # Run on every push to main or master
    push:
        branches:
            - main
            - master

    # Also run on pull requests
    pull_request:

jobs:
    # ==========================================
    # 1. TEST BACKEND
    # ==========================================
    test-backend:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Build and test with Maven
              run: mvn clean verify
              working-directory: ./backend

    # ==========================================
    # 2. SONARQUBE
    # ==========================================
    sonar:
        needs: test-backend
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Run SonarQube analysis
              run: |
                  mvn -B verify sonar:sonar \
                    -Dsonar.projectKey=cr0cblanc75_TP2-Docker \
                    -Dsonar.organization=cr0cblanc75 \
                    -Dsonar.host.url=https://sonarcloud.io \
                    -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
                    --file ./backend/pom.xml

    # ==========================================
    # 3. BUILD BACKEND IMAGE
    # ==========================================
    build-backend:
        needs: test-backend
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build backend image
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  tags: ${{ secrets.DOCKER_USERNAME }}/tp2-docker-devops-back:latest
                  load: true

            - name: Save backend image
              run: |
                  docker save \
                    ${{ secrets.DOCKER_USERNAME }}/tp2-docker-devops-back:latest \
                    -o backend.tar

            - name: Upload backend image
              uses: actions/upload-artifact@v4
              with:
                  name: backend-image
                  path: backend.tar

    # ==========================================
    # 4. BUILD DATABASE IMAGE
    # ==========================================
    build-database:
        needs: test-backend
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build database image
              uses: docker/build-push-action@v6
              with:
                  context: ./db
                  tags: ${{ secrets.DOCKER_USERNAME }}/tp2-docker-devops-db:latest
                  load: true

            - name: Save database image
              run: |
                  docker save \
                    ${{ secrets.DOCKER_USERNAME }}/tp2-docker-devops-db:latest \
                    -o database.tar

            - name: Upload database image
              uses: actions/upload-artifact@v4
              with:
                  name: database-image
                  path: database.tar

    # ==========================================
    # 5. BUILD HTTPD IMAGE
    # ==========================================
    build-httpd:
        needs: test-backend
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build httpd image
              uses: docker/build-push-action@v6
              with:
                  context: ./http
                  tags: ${{ secrets.DOCKER_USERNAME }}/tp2-docker-devops-front:latest
                  load: true

            - name: Save httpd image
              run: |
                  docker save \
                    ${{ secrets.DOCKER_USERNAME }}/tp2-docker-devops-front:latest \
                    -o httpd.tar

            - name: Upload httpd image
              uses: actions/upload-artifact@v4
              with:
                  name: httpd-image
                  path: httpd.tar

    # ==========================================
    # 6. PUSH BACKEND IMAGE
    # ==========================================
    push-backend:
        needs: build-backend
        runs-on: ubuntu-24.04

        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

        steps:
            - name: Download backend image
              uses: actions/download-artifact@v4
              with:
                  name: backend-image

            - name: Load backend image
              run: docker load -i backend.tar

            - name: Login to DockerHub
              run: |
                  echo "${{ secrets.DOCKER_PASSWORD }}" | \
                  docker login \
                    --username ${{ secrets.DOCKER_USERNAME }} \
                    --password-stdin

            - name: Push backend image
              run: |
                  docker push \
                    ${{ secrets.DOCKER_USERNAME }}/tp2-docker-devops-back:latest

    # ==========================================
    # 7. PUSH DATABASE IMAGE
    # ==========================================
    push-database:
        needs: build-database
        runs-on: ubuntu-24.04

        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

        steps:
            - name: Download database image
              uses: actions/download-artifact@v4
              with:
                  name: database-image

            - name: Load database image
              run: docker load -i database.tar

            - name: Login to DockerHub
              run: |
                  echo "${{ secrets.DOCKER_PASSWORD }}" | \
                  docker login \
                    --username ${{ secrets.DOCKER_USERNAME }} \
                    --password-stdin

            - name: Push database image
              run: |
                  docker push \
                    ${{ secrets.DOCKER_USERNAME }}/tp2-docker-devops-db:latest

    # ==========================================
    # 8. PUSH HTTPD IMAGE
    # ==========================================
    push-httpd:
        needs: build-httpd
        runs-on: ubuntu-24.04

        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

        steps:
            - name: Download httpd image
              uses: actions/download-artifact@v4
              with:
                  name: httpd-image

            - name: Load httpd image
              run: docker load -i httpd.tar

            - name: Login to DockerHub
              run: |
                  echo "${{ secrets.DOCKER_PASSWORD }}" | \
                  docker login \
                    --username ${{ secrets.DOCKER_USERNAME }} \
                    --password-stdin

            - name: Push httpd image
              run: |
                  docker push \
                    ${{ secrets.DOCKER_USERNAME }}/tp2-docker-devops-front:latest
